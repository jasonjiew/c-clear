ShortDescription: Windows disk cleaner focused on freeing C drive space safely.
Description: |-
  C-Clear scans your C drive (and any fixed drive), shows what occupies space,
  identifies safely cleanable content with a curated rule pack, and cleans to
  the Recycle Bin with a full JSONL audit trail. V3 adds a WinDirStat-style
  squarified treemap with drill-down, multi-drive support, a smart cleanup
  advisor, uninstall leftover scan, disk-full forecasting with HTML weekly
  reports, advanced auto-clean triggers (logon + free-space threshold) and
  download duplicate detection. LiveCharts2 trend charts and a polished
  Fluent UI with light/dark/system themes.
Tags:
  - disk-cleanup
  - storage
  - utilities
ReleaseNotes: |-
  Third public release (V3): LiveCharts2 trend charts and micro-interactions;
  WinDirStat-style squarified treemap with drill-down (flagship); multi-drive
  support (analyze/health-check/clean D/E drives with blacklist adaptation);
  smart cleanup advisor, uninstall leftover scan, disk-full forecast with HTML
  weekly reports, advanced auto-clean triggers (logon + free-space threshold),
  download duplicate detection (Pro feature set, free core never gated);
  offline Ed25519 licensing switch enabled.
