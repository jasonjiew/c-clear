ShortDescription: Windows disk cleaner focused on freeing C drive space safely.
Description: |-
  C-Clear scans your C drive, shows what occupies space, identifies safely
  cleanable content with a curated rule pack, and cleans to the Recycle Bin
  with a full JSONL audit trail. Includes dev cache cleanup with official
  CLI preference (npm/pnpm/pip/nuget/docker...), duplicate finder and empty
  directory folding.
Tags:
  - disk-cleanup
  - storage
  - utilities
ReleaseNotes: |-
  Second public beta (V2): Fluent UI (WPF-UI 4.3) with light/dark/system
  themes and dashboard with health score; online rule pack with SHA256
  verification, 30-day cleanup history trend, weekly auto-clean (safe rules only), deep-clean guides (DISM/hibernation/restore points), OneDrive placeholder stats, offline Ed25519 licensing foundation.
